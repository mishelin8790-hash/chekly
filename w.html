  .body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .title { font-weight:600; font-size:17px; line-height:1.3; margin:0; overflow-wrap:anywhere; }
  .price { font-weight:700; font-size:18px; }
  .meta { font-size:14px; color:var(--muted); overflow-wrap:anywhere; }
  .inote { font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .actions { margin-top:auto; padding-top:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .shop { font-size:14px; text-decoration:none; font-weight:500; margin-right:auto; }

  function loadList(listId) {
    var base = DOCS + '/wishlists/' + encodeURIComponent(listId);
    return getJSON(base).then(function (doc) {
      if (!doc) return { notFound: true };
      var list = decodeDoc(doc);
      var items = [];
      function page(token) {
        var url = base + '/items?pageSize=300' + (token ? '&pageToken=' + encodeURIComponent(token) : '');
        return getJSON(url).then(function (j) {
          ((j && j.documents) || []).forEach(function (d) { items.push(decodeDoc(d)); });
          if (j && j.nextPageToken && items.length < 3000) return page(j.nextPageToken);
        });
      }
      return page(null).then(function () { return { list: list, items: sortItems(items) }; });
    });
  }
  function itemUrl(listId, itemId) {
    return DOCS + '/wishlists/' + encodeURIComponent(listId) + '/items/' + encodeURIComponent(itemId) +
      '?updateMask.fieldPaths=reservedBy&updateMask.fieldPaths=reservedName&updateMask.fieldPaths=reservedAt&currentDocument.exists=true';
  }
  function patchReservation(listId, itemId, makeFields, retried) {
    return getToken(!!retried).then(function (tok) {
      return fetch(itemUrl(listId, itemId), {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: makeFields(myUid()) })
      });
    }).then(function (r) {
      if (r.status === 401 && !retried) return patchReservation(listId, itemId, makeFields, true);
      if (!r.ok) throw httpError(r.status, 'patch');
      return r.json();
    });
  }
  function reserveItem(listId, itemId, name) {
    return patchReservation(listId, itemId, function (uid) {
      return {
        reservedBy: { stringValue: uid },
        reservedName: { stringValue: String(name || '').trim().slice(0, 60) },
        reservedAt: { timestampValue: new Date().toISOString() }
      };
    });
  }
  function releaseItem(listId, itemId) {
    return patchReservation(listId, itemId, function () {
      return { reservedBy: { nullValue: null }, reservedName: { stringValue: '' }, reservedAt: { nullValue: null } };
    });
  }

  var api = {
    DICT: DICT, pickLang: pickLang, decodeDoc: decodeDoc, safeUrl: safeUrl, formatPrice: formatPrice, daysUntil: daysUntil,
    countdownText: countdownText, plural: plural, sortItems: sortItems, validId: validId, appLink: appLink,
    loadList: loadList, reserveItem: reserveItem, releaseItem: releaseItem, getToken: getToken, myUid: myUid, store: store,
    setLang: function (l) { LANG = l; LOCALE = l; D = DICT[l]; }
  };
  if (W.__CHEKLY_TEST__) { W.__CHEKLY_TEST__.api = api; return; }

  // ================= UI =================
  var doc = W.document;
  var app = doc.getElementById('app');
  doc.documentElement.lang = LANG;
  doc.getElementById('f-made').textContent = t('made');
  doc.getElementById('f-privacy').textContent = t('privacy');

  var listId = null;
  try { listId = new URLSearchParams(W.location.search).get('id'); } catch (e) {}

  var state = { status: 'loading', list: null, items: [], busy: null, nameFor: null, nameDraft: store.get(NAME_KEY) || '' };
  var lastSig = '', lastLoad = 0, loading = null;

  function h(tag, attrs) {
    var el = doc.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null && x !== false) el.appendChild(typeof x === 'string' ? doc.createTextNode(x) : x); });
      else el.appendChild(typeof c === 'string' ? doc.createTextNode(c) : c);
    }
    return el;
  }

  var toastTimer = null;
  function toast(msg, isError) {
    var el = doc.getElementById('toast');
    el.textContent = msg;
    el.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = isError ? 'error' : ''; }, isError ? 5000 : 3000);
  }

  function stateView(icon, title, hint, withRetry) {
    return h('div', { class: 'state' },
      h('div', { class: 'big', 'aria-hidden': 'true', text: icon }),
      h('h2', { text: title }),
      hint ? h('p', { class: 'muted', text: hint }) : null,
      withRetry ? h('button', { class: 'primary', onclick: function () { state.status = 'loading'; render(true); refresh(true); }, text: t('retry') }) : null);
  }

  function isOwnerView() {
    return !!(state.list && myUid() && state.list.ownerUid === myUid() && state.list.hideReservations !== false);
  }

  function renderHeader() {
    var L = state.list;
    var title = str(L.title) || t('wishlist');
    doc.title = title + ' — Chekly';
    var ev = null;
    if (L.eventDate) {
      var days = daysUntil(L.eventDate);
      if (days != null) {
        ev = h('p', { class: 'event' },
          h('span', { text: formatDate(L.eventDate) }),
          h('span', { class: 'pill' + (days < 0 ? ' past' : ''), text: countdownText(days) }));
      }
    }
    var taken = state.items.filter(function (i) { return !!i.reservedBy; }).length;
    var link = appLink(listId, nav.userAgent, nav.maxTouchPoints || 0);
    return h('header', null,
      h('h1', { text: title }),
      str(L.ownerName).trim() ? h('p', { class: 'owner muted', text: t('from', { name: str(L.ownerName).trim() }) }) : null,
      ev,
      str(L.note).trim() ? h('p', { class: 'note', text: str(L.note).trim() }) : null,
      isOwnerView() ? h('p', { class: 'summary muted', text: t('ownList') })
        : (state.items.length ? h('p', { class: 'summary muted', text: t('summary', { n: taken, total: state.items.length }) }) : null),
      link ? h('a', { class: 'openapp', href: link, text: t('openApp') + ' ›' }) : null);
  }

  function renderItem(it) {
    var uid = myUid();
    var hide = isOwnerView();
    var mine = !hide && !!it.reservedBy && it.reservedBy === uid;
    var taken = !hide && !!it.reservedBy && !mine;
    var url = safeUrl(it.url), img = safeUrl(it.imageUrl);
    var store_ = str(it.store).trim() || (url ? hostOf(url) : '');
    var busy = state.busy === it.id;

    var ph = h('div', { class: 'ph', 'aria-hidden': img ? null : 'true' });
    if (img) {
      var im = h('img', { src: img, alt: str(it.title), loading: 'lazy', decoding: 'async', referrerpolicy: 'no-referrer' });
      im.addEventListener('error', function () { ph.textContent = '🎁'; ph.setAttribute('aria-hidden', 'true'); });
      ph.appendChild(im);
    } else ph.textContent = '🎁';

    var actions = h('div', { class: 'actions' });
    if (state.nameFor === it.id && !taken && !mine) {
      var input = h('input', { type: 'text', maxlength: '60', autocomplete: 'name', enterkeyhint: 'done', placeholder: t('namePh'), id: 'name-' + it.id });
      input.value = state.nameDraft;
      input.addEventListener('input', function () { state.nameDraft = input.value; });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submitName(it.id); } if (e.key === 'Escape') closeName(); });
      actions.appendChild(h('div', { class: 'nameform' },
        h('label', { for: 'name-' + it.id, text: t('nameLabel') }),
        input,
        h('p', { class: 'hint', text: t('nameHint') }),
        h('div', { class: 'row' },
          h('button', { class: 'primary', disabled: busy, onclick: function () { submitName(it.id); }, text: busy ? '…' : t('confirm') }),
          h('button', { class: 'ghost', disabled: busy, onclick: closeName, text: t('close') }))));
      setTimeout(function () { try { input.focus(); } catch (e) {} }, 0);
    } else {
      if (url) actions.appendChild(h('a', { class: 'shop', href: url, target: '_blank', rel: 'noopener noreferrer', text: t('open') + ' ↗' }));
      if (mine) {
        actions.appendChild(h('span', { class: 'badge', text: '✓ ' + t('mine') }));
        actions.appendChild(h('button', { class: 'secondary', disabled: busy, onclick: function () { doRelease(it.id); }, text: busy ? '…' : t('cancel') }));
      } else if (taken) {
        var nm = str(it.reservedName).trim();
        actions.appendChild(h('span', { class: 'badge', text: nm ? t('takenBy', { name: nm }) : t('taken') }));
      } else if (!hide) {
        actions.appendChild(h('button', { class: 'primary', disabled: busy || !!state.busy, onclick: function () { startReserve(it.id); }, text: busy ? '…' : t('reserve') }));
      }
    }

    var price = formatPrice(it.priceMinor, it.currency);
    return h('article', { class: 'item' + (taken ? ' taken' : '') + (mine ? ' mine' : '') },
      ph,
      h('div', { class: 'body' },
        h('h3', { class: 'title', text: str(it.title).trim() || '—' }),
        price ? h('div', { class: 'price', text: price }) : null,
        store_ ? h('div', { class: 'meta', text: store_ }) : null,
        str(it.note).trim() ? h('div', { class: 'inote', text: str(it.note).trim() }) : null,
        actions));
  }

  function render(force) {
    var sig = JSON.stringify([state.status, state.list, state.items, state.busy, state.nameFor, myUid(), LANG]);
    if (!force && sig === lastSig) return;
    lastSig = sig;
    var view;
    if (state.status === 'loading') view = h('div', { class: 'state' }, h('div', { class: 'spinner', role: 'status', 'aria-label': t('loading') }), h('p', { class: 'muted', text: t('loading') }));
    else if (state.status === 'notfound') view = stateView('🔍', t('notFound'), t('notFoundHint'));
    else if (state.status === 'error') view = stateView('⚠️', t('error'), t('errorHint'), true);
    else {
      view = h('div', null, renderHeader(),
        state.items.length ? h('div', { class: 'grid' }, state.items.map(renderItem)) : stateView('🎁', t('empty'), t('emptyHint')));
    }
    app.replaceChildren ? app.replaceChildren(view) : (app.textContent = '', app.appendChild(view));
  }

  function refresh(manual) {
    if (loading) return manual ? loading.then(function () { return refresh(true); }) : loading;
    if (!manual && (state.nameFor || state.busy)) return Promise.resolve(); // don't disturb typing / pending writes
    lastLoad = Date.now();
    return (loading = loadList(listId).then(function (res) {
      if (res.notFound) { state.status = 'notfound'; state.list = null; state.items = []; }
      else { state.status = 'ok'; state.list = res.list; state.items = res.items; }
    }, function () {
      if (state.status !== 'ok') state.status = 'error'; // keep showing stale data on transient errors
    }).then(function () { loading = null; render(); }));
  }

  function startReserve(itemId) {
    var name = (store.get(NAME_KEY) || '').trim();
    if (name) return doReserve(itemId, name);
    state.nameFor = itemId;
    render();
  }
  function closeName() { state.nameFor = null; render(); }
  function submitName(itemId) {
    var name = String(state.nameDraft || '').trim().slice(0, 60);
    if (!name) { var el = doc.getElementById('name-' + itemId); if (el) el.focus(); return; }
    store.set(NAME_KEY, name);
    doReserve(itemId, name);
  }

  function afterWrite(itemId, ok, okMsg, err) {
    state.busy = null;
    state.nameFor = null;
    return refresh(true).then(function () {
      if (ok) { toast(okMsg); return; }
      var it = state.items.filter(function (x) { return x.id === itemId; })[0];
      if (err && err.status === 403 && it && it.reservedBy && it.reservedBy !== myUid()) toast(t('raceLost'), true);
      else if (err && err.status === 404) toast(t('raceLost'), true);
      else toast(t('saveError'), true);
    });
  }
  function doReserve(itemId, name) {
    state.busy = itemId; render();
    reserveItem(listId, itemId, name).then(function () { return afterWrite(itemId, true, t('reserved')); },
      function (e) { return afterWrite(itemId, false, null, e); });
  }
  function doRelease(itemId) {
    state.busy = itemId; render();
    releaseItem(listId, itemId).then(function () { return afterWrite(itemId, true, t('released')); },
      function (e) { return afterWrite(itemId, false, null, e); });
  }

  // ---------- boot ----------
  if (!validId(listId)) { state.status = 'notfound'; render(true); return; }
  render(true);
  refresh(true);
  // Sign in anonymously in the background so reservations are tied to this browser (uid + refresh token kept in localStorage).
  getToken(false).then(function () { render(); }, function () {});

  setInterval(function () { if (!doc.hidden) refresh(false); }, REFRESH_MS);
  function onWake() { if (!doc.hidden && Date.now() - lastLoad > 3000) refresh(false); }
  W.addEventListener('focus', onWake);
  doc.addEventListener('visibilitychange', onWake);
})();
</script>
</body>
</html>
